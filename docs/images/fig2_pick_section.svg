<text x='32.0' y='404.0' font-size='11' fill='#333' text-anchor='start'>sequence: anvil vacuum on → pins up (tape peels) → jaws descend beside the end faces, above the neighbours' plane</text>
<text x='32.0' y='418.0' font-size='11' fill='#333' text-anchor='start'>→ close on the end-face middles → lift → pins retract → carry to stick. No top-surface or facet contact at any time.</text>
